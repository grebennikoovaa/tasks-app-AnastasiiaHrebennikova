name: Scan 

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  run_tests:
    runs-on: ubuntu-latest
    steps:
      -name: checkout repository
      -uses: actions/checkout@v7

      -name: setup python
      -uses: actions/setup-python@v7
      with:
          python-version: "3.12"
      
      name: install dependecies for tasks-api
      run: pip install -r services/tasks-api/requirements.txt

      name: install dependecies for title-normalizer
      run: pip install -r services/title-normalizer/requirements.txt

      name: run tasks-api
      run: pytest services/tasks-api
